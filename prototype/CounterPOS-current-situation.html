const imageMap={'KE-001':'assets/product_stock_001.png','KE-002':'assets/product_stock_002.webp','KE-003':'assets/product_stock_003.webp','KE-004':'assets/product_stock_004.jpg','CAT-101':'assets/product_lib_10001.webp','CAT-102':'assets/product_lib_10002.webp','CAT-103':'assets/product_lib_10003.webp'};
data.products.forEach(p=>{if(imageMap[p.code])p.image=imageMap[p.code]});
// Mirror the Android repository: 19 in-stock products plus the complete 265-item catalog.
const customProducts=data.products.filter(p=>String(p.code||'').startsWith('LOCAL-'));
const oldProductByCode=new Map(data.products.map(p=>[p.code,p]));
const mapAndroidProduct=r=>{let old=oldProductByCode.get(r.code);return {...r,price:r.price||r.suggestedPrice||0,stock:old?.stock ?? r.stock,units:old?.units?.length?old.units:r.units}};
data.products=androidCatalog.filter(r=>r.inMyStock).map(mapAndroidProduct).concat(customProducts);
data.catalog=androidCatalog.filter(r=>!r.inMyStock).map(mapAndroidProduct);
function productImage(p){return p.image&&p.image.includes('.')?`<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.replaceWith(document.createTextNode('▣'))">`:p.image||'▣'}
function toast(t){toastEl.textContent=t;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),2400)}
function header(title,sub='',back=''){if(state.screen==='workspace'&&state.searchOpen)return `<div class="topbar search-top"><button class="iconbtn" onclick="state.searchOpen=false;state.search='';render()">‹</button><input class="input top-search-input" autofocus value="${state.search}" oninput="state.search=this.value;render()" placeholder="${state.tab==='stock'?'Search bottles & brands...':'Search to sell...'}"><button class="iconbtn" onclick="openScanner()">⌕</button></div>`;return `<div class="topbar">${back?`<button class="iconbtn" onclick="${back}">‹</button>`:'<span class="brand-dot"></span>'}<div class="title"><b>${title}</b><small>${sub}</small></div>${state.screen==='workspace'?`<div class="top-actions"><button class="iconbtn" onclick="state.searchOpen=true;render()">⌕</button>${state.tab==='stock'&&state.role!=='waiter'?`<button class="iconbtn" onclick="newProduct()">＋</button>`:''}${state.role==='owner'?`<button class="settings-btn" onclick="state.showTeam=true;render()">Settings</button>`:''}<button class="scan-btn" onclick="openScanner()">▦ Scan</button></div>`:''}${state.role?`<button class="iconbtn" onclick="logout()">↪</button>`:''}</div>`}
function auth(){return `${header('Counter POS','Secure business point of sale')}<main class="content center"><div class="authbrand"><div class="logo">CP</div><div class="h1">Counter POS</div><div class="muted">Secure business point of sale</div></div><div class="card"><div class="h2">Sign in</div><p class="muted">Enter your business or employee passkey, or the current Superadmin token. Access opens automatically for your account.</p><input id="credential" class="input" placeholder="Passkey or access token"><button class="btn block" onclick="signIn()">Continue</button><button class="btn outline block" onclick="qrLogin()">Sign in with QR code</button><div class="tiny muted" style="margin-top:9px">Superadmin token access is separate from owner and employee passkeys.</div></div><div class="card"><div class="label">Superadmin access</div><button class="btn soft block" style="margin-top:8px" onclick="document.getElementById('credential').value='CPSA1|DEMO-SUPERADMIN'">Paste demo backend Superadmin token</button></div></main>`}
function signIn(){let v=document.getElementById('credential').value.trim();if(!v)return toast('Enter a passkey or token');if(v.startsWith('CPSA1'))return enter('superadmin');let employeeBusiness=null,employee=null;for(const b of data.businesses){const found=(b.employees||[]).find(e=>e.passkey===v);if(found){employeeBusiness=b;employee=found;break}}if(employee){state.businessId=employeeBusiness.id;state.counter=employeeBusiness.counters[0]||'';state.lockedBusinessId=employeeBusiness.id;state.lockedEmployeeId=employee.id;if(employeeBusiness.status!=='active'){state.screen='business-blocked';state.role='waiter';return render()}if(employee.status!=='active'){state.screen='employee-locked';state.role='waiter';return render()}if(!withinEmployeeHours(employee)){state.screen='hours-locked';state.role='waiter';state.lockMessage=`${employee.name} is outside the active working hours configured by the business owner.`;return render()}state.role='waiter';state.screen='workspace';state.tab='scan';return render()}let b=data.businesses.find(x=>x.pass===v);if(!b)return toast('Passkey not found or already used');state.businessId=b.id;state.counter=b.counters[0]||'';state.lockedBusinessId=b.id;if(b.status!=='active'){state.role='owner';state.screen='business-blocked';return render()}b.pass=null;b.ownerEmail=b.ownerEmail==='Pending owner enrollment'?'Owner signed in':b.ownerEmail;save();enter('owner');toast(`Opened ${b.name}`)}
function withinEmployeeHours(e){if(!e.hours||e.hours==='Not set')return true;let m=String(e.hours).match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);if(!m)return true;let now=new Date(),current=now.getHours()*60+now.getMinutes(),start=Number(m[1])*60+Number(m[2]),end=Number(m[3])*60+Number(m[4]);return current>=start&&current<=end}
function qrLogin(){modal.innerHTML=`<div class="sheet"><div class="row between"><div class="h2">Sign in with QR code</div><button class="iconbtn" onclick="closeModal()">×</button></div><p class="muted">Waiting for the business owner to approve this QR…</p>${qr('CPX1.LOGIN-CHALLENGE')}<button class="btn block" onclick="closeModal();enter('waiter');toast('Signed in successfully')">Simulate owner approval</button></div>`;modal.classList.remove('hidden')}
function enter(role){state.role=role;state.screen=role==='superadmin'?'superadmin':(role==='waiter'?'workspace':'workspace');state.tab=role==='waiter'?'scan':'scan';render()}
function logout(){state={...state,screen:'auth',role:null,showTeam:false,selectedBusiness:null};render()}
function bottom(){return `<div class="bottom"><button class="nav ${state.tab==='scan'?'active':''}" onclick="state.tab='scan';render()"><strong>▣</strong>POS / Sell</button><button class="nav ${state.tab==='stock'?'active':''}" onclick="state.tab='stock';render()"><strong>▤</strong>Stock (${products().length})</button><button class="nav ${state.tab==='sales'?'active':''}" onclick="state.tab='sales';render()"><strong>▥</strong>Sales</button><button class="nav ${state.tab==='reports'?'active':''}" onclick="state.tab='reports';render()"><strong>▦</strong>Reports</button>${business().tablesEnabled?`<button class="nav ${state.tab==='tables'?'active':''}" onclick="state.tab='tables';render()"><strong>♧</strong>Tables</button>`:''}</div>`}
function counter(){if(!business().counters.length)return '';return `<div class="counter"><div class="row between"><b>Taking drinks from: ${state.counter}</b><span class="tiny">Change</span></div><select onchange="state.counter=this.value;render()">${business().counters.map(c=>`<option ${c===state.counter?'selected':''}>${c}</option>`).join('')}</select></div>`}
function workspace(){return `${header('Counter POS',state.role==='waiter'?'Employee workspace':'Owner workspace')}<main class="content">${counter()}${state.tab==='scan'?sell():state.tab==='stock'?stock():state.tab==='sales'?sales():state.tab==='reports'?reports():tables()}</main>${bottom()}${state.showTeam?teamDialog():''}${state.showScanner?scanner():''}`}
function sell(){let q=state.search.toLowerCase(),items=products().filter(p=>(state.category==='All'||p.category===state.category)&&(!q||[p.name,p.brand,p.code].join(' ').toLowerCase().includes(q)));let cats=['All',...new Set(products().map(p=>p.category))];return `<div class="row between"><div><div class="h1">Sell</div><div class="muted">Tap a product to sell bottle / glass / cup.</div></div><button class="btn" onclick="openScanner()">Scan</button></div><div class="chips">${cats.map(c=>`<button class="chip ${state.category===c?'chosen':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div class="sectionline"><b>Shop Inventory (${items.length})</b><span class="tiny muted">${state.counter}</span></div><div class="productgrid">${items.map(p=>`<button class="productcard" onclick="openSale('${p.code}')"><div class="prodimg">${productImage(p)}</div><b>${p.name}</b><span>${p.brand} · ${p.size}</span><strong>${money(p.price)}</strong><small>${p.stock} in stock</small></button>`).join('')}</div>${!items.length?`<div class="empty">No products match '${state.search}'.</div>`:''}</div>`}
function openSale(code){state.selectedProduct=code;state.selectedUnit=null;modal.innerHTML=saleSheet();modal.classList.remove('hidden')}
function saleSheet(){let p=products().find(x=>x.code===state.selectedProduct),unit=state.selectedUnit||p.units[0][0];return `<div class="sheet"><div class="row between"><div><div class="h2">${p.name}</div><div class="muted">${p.brand} · ${p.size} · ${p.stock} in stock</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="label" style="margin-top:16px">Unit of sale</div><div class="unitrow">${p.units.map(u=>`<button class="unit ${unit===u[0]?'chosen':''}" onclick="state.selectedUnit='${u[0]}';openSale('${p.code}')">${u[0]}<b>${money(u[1])}</b></button>`).join('')}</div><label class="label">Quantity to sell</label><input id="qty" class="input" type="number" min="1" max="${p.stock}" value="1"><button class="btn block" onclick="completeSale()">Complete Sale · ${money(p.units.find(u=>u[0]===unit)[1])}</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`}
function completeSale(table=null){let p=products().find(x=>x.code===state.selectedProduct),u=state.selectedUnit||p.units[0][0],price=p.units.find(x=>x[0]===u)[1],qty=Math.max(1,Number(document.getElementById('qty').value||1));if(p.stock<qty)return toast('Could not record sale. Check stock.');p.stock-=qty;data.sales.unshift({id:Date.now(),product:p.name,code:p.code,unit:u,qty,total:qty*price,counter:state.counter,table:table||null,waiter:state.role==='waiter'?'Employee':'Owner',time:new Date().toISOString()});save();closeModal();toast(`Sold ${qty}x ${p.name} (${u}) · ${money(qty*price)}`);render()}
function stock(){let mine=state.stockMode==='MY_STOCK',list=(mine?products():data.catalog).filter(p=>!state.search||[p.name,p.brand].join(' ').toLowerCase().includes(state.search.toLowerCase()));return `<div class="row between"><div><div class="h1">Stock</div><div class="muted">Manage your shelf and beverage catalog.</div></div>${state.role==='owner'?`<button class="btn soft" onclick="newProduct()">＋ New</button>`:''}</div><div class="modebar"><button class="mode ${mine?'active':''}" onclick="state.stockMode='MY_STOCK';render()">Shop Shelf (${products().length})</button><button class="mode ${!mine?'active':''}" onclick="state.stockMode='LIBRARY';render()">Catalog (${data.catalog.length})</button></div>${mine?`<div class="summarypill">Total: ${products().reduce((a,p)=>a+p.stock,0)} bottles on shelf across ${products().length} products <b>Add / Edit below</b></div>`:''}${list.map(p=>mine?stockCard(p):catalogCard(p)).join('')}</div>`}
function stockCard(p){return `<div class="stockcard"><div class="prodimg">${productImage(p)}</div><div class="grow"><b>${p.name}</b><div class="muted">${p.brand} · ${p.size} · ${p.category}</div><div class="stockline"><strong>${p.stock}</strong> bottles on shelf · ${money(p.price)}</div></div>${state.role!=='waiter'?`<button class="btn outline" onclick="addStock('${p.code}')">Add</button><button class="btn outline" onclick="editProduct('${p.code}')">Edit</button>`:''}</div>`}
function catalogCard(p){return `<div class="stockcard"><div class="prodimg">${productImage(p)}</div><div class="grow"><b>${p.name}</b><div class="muted">${p.brand} · ${p.size} · ${p.category}</div><div class="stockline">Suggested: ${money(p.price)}</div></div>${state.role!=='waiter'?`<button class="btn" onclick="addCatalog('${p.code}')">Add to Stock</button>`:''}</div>`}
function addStock(code){let p=products().find(x=>x.code===code);modal.innerHTML=`<div class="sheet"><div class="h2">Add Bottles to Stock</div><div class="muted">${p.name} · ${p.brand} · ${p.size}</div><label class="label">Number of bottles to add</label><input id="stockQty" class="input" type="number" value="6" placeholder="e.g. 6, 12, 24, 48..."><label class="label">Unit cost (KSh)</label><input id="stockCost" class="input" type="number" value="0" placeholder="0 if unknown"><button class="btn block" onclick="confirmAddStock('${code}')">Add to Stock</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function confirmAddStock(code){let p=products().find(x=>x.code===code),n=Math.max(1,Number(document.getElementById('stockQty').value||0));if(!n)return toast('Enter the number of bottles');p.stock+=n;save();closeModal();toast(`Added ${n} bottles to ${p.name}`);render()}
function addCatalog(code){let p=data.catalog.find(x=>x.code===code);modal.innerHTML=`<div class="sheet"><div class="h2">Add ${p.name} to Stock</div><div class="muted">${p.brand} · ${p.size} · Suggested: ${money(p.price)}</div><label class="label">Initial Stock (Bottles)</label><input id="catalogQty" class="input" type="number" value="12"><label class="label">Your Selling Price (KSh)</label><input id="catalogPrice" class="input" type="number" value="${p.price}"><label class="label">Unit cost (KSh)</label><input id="catalogCost" class="input" type="number" value="0" placeholder="0 if unknown"><button class="btn block" onclick="confirmCatalog('${code}')">Add to Shelf</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function confirmCatalog(code){let p=data.catalog.find(x=>x.code===code),stock=Math.max(1,Number(document.getElementById('catalogQty').value||0)),price=Number(document.getElementById('catalogPrice').value||p.price);products().push({...p,price,stock,units:[['Bottle',price]]});data.catalog=data.catalog.filter(x=>x.code!==code);save();closeModal();toast(`${p.name} added to stock`);render()}
function editProduct(code){let p=products().find(x=>x.code===code);modal.innerHTML=`<div class="sheet"><div class="h2">Edit Product & Stock</div><label class="label">Product Name</label><input id="editName" class="input" value="${p.name}"><label class="label">Shelf Stock</label><input id="editStock" class="input" type="number" value="${p.stock}"><label class="label">Base Price (KSh)</label><input id="editPrice" class="input" type="number" value="${p.price}"><div class="label">Units of sale</div><div class="unitrow">${p.units.map((u,i)=>`<div class="unit"><input class="input" value="${u[0]}" id="unitName${i}"><input class="input" type="number" value="${u[1]}" id="unitPrice${i}"></div>`).join('')}</div><button class="btn block" onclick="confirmEdit('${code}')">Save Changes</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function confirmEdit(code){let p=products().find(x=>x.code===code);p.name=document.getElementById('editName').value.trim()||p.name;p.stock=Math.max(0,Number(document.getElementById('editStock').value||0));p.price=Number(document.getElementById('editPrice').value||p.price);p.units=p.units.map((u,i)=>[document.getElementById('unitName'+i).value.trim()||u[0],Number(document.getElementById('unitPrice'+i).value||u[1])]);save();closeModal();toast('Product changes saved');render()}
function newProduct(){modal.innerHTML=`<div class="sheet"><div class="h2">Add New Product</div><label class="label">Product Name</label><input id="newProductName" class="input" placeholder="e.g. Muratina, Chang'aa, Local Brew..."><label class="label">Barcode / Code</label><input id="newProductCode" class="input" placeholder="Optional"><label class="label">Initial Stock (Bottles)</label><input id="newProductStock" class="input" type="number" value="12"><label class="label">Bottle Price (KSh)</label><input id="newProductPrice" class="input" type="number" value="500"><label class="label">Unit cost (KSh)</label><input id="newProductCost" class="input" type="number" value="0" placeholder="0 if unknown"><button class="btn block" onclick="confirmNewProduct()">Save & Add to Stock</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function confirmNewProduct(){let name=document.getElementById('newProductName').value.trim();if(!name)return toast('Enter a product name');let price=Number(document.getElementById('newProductPrice').value||500),code=document.getElementById('newProductCode').value.trim()||'LOCAL-'+Date.now();products().push({code,name,brand:'Local',size:'',category:'Local Liquor',price,stock:Math.max(0,Number(document.getElementById('newProductStock').value||0)),image:'assets/product_lib_10001.webp',units:[['Bottle',price]]});save();closeModal();toast('New product added to stock');render()}
function sales(){let total=data.sales.reduce((a,s)=>a+s.total,0),units=data.sales.reduce((a,s)=>a+s.qty,0);return `<div class="h1">Sales</div><div class="metricgrid"><div class="metric green"><span>Today's Revenue</span><b>${money(total)}</b></div><div class="metric"><span>Units / Bottles Sold</span><b>${units}</b></div></div><button class="btn outline block" onclick="undoSale()">↶ Undo last sale & restore shelf stock</button><button class="btn outline block" onclick="toast('Sales PDF date range selected')">▧ Export sales PDF by date</button><div class="sectionline"><b>Sales Receipts (${data.sales.length})</b></div>${data.sales.length?data.sales.map(s=>`<div class="receipt"><div class="row between"><b>${s.product}</b><strong>${money(s.total)}</strong></div><div class="muted">${s.qty} × ${s.unit} · ${s.counter}${s.table?' · '+s.table:''}</div><div class="tiny muted">${s.waiter} · ${new Date(s.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):`<div class="empty">No sales made today yet. Go to POS tab to sell products.</div>`}</div>`}
function undoSale(){let s=data.sales.shift();if(!s)return toast('Nothing to undo');let p=products().find(p=>p.code===s.code);if(p)p.stock+=s.qty;save();toast('Last sale undone and stock restored');render()}
function reports(){let rows=business().counters.map(c=>{let a=data.sales.filter(s=>s.counter===c);return {c,n:a.reduce((x,s)=>x+s.qty,0),sales:a.length,total:a.reduce((x,s)=>x+s.total,0)}}),units=rows.reduce((x,r)=>x+r.n,0),total=rows.reduce((x,r)=>x+r.total,0);return `<div class="row between"><div><div class="h1">Counter report</div><div class="muted">Today · drinks taken from each source counter</div></div><button class="iconbtn" onclick="render()">↻</button></div><div class="metricgrid"><div class="metric green"><span>Total units</span><b>${units}</b></div><div class="metric"><span>Total revenue</span><b>${money(total)}</b></div></div><div class="card"><div class="h2">Counter movement</div>${rows.map(r=>`<div class="reportrow"><div class="row between"><b>${r.c}</b><strong>${money(r.total)}</strong></div><div class="row between tiny muted"><span>${r.sales} sales</span><span>${r.n} units</span></div><div class="bar"><i style="width:${units?Math.max(3,r.n/units*100):3}%"></i></div></div>`).join('')}</div>${!data.sales.length?`<div class="empty">No counter data for today yet.</div>`:''}</div>`}
function tables(){if(state.tableId)return tableDetail();return `<div class="row between"><div><div class="h1">Tables</div><div class="muted">Open a running bill for each table and print it when guests are ready to pay.</div></div><button class="btn" onclick="addTable()">＋ Add table</button></div><div class="tablelist">${data.tables.map(t=>{let lines=data.sales.filter(s=>s.table===t.name),total=lines.reduce((a,s)=>a+s.total,0);return `<button class="tablecard" onclick="state.tableId='${t.id}';render()"><span class="tableicon">♧</span><span class="grow"><b>${t.name}</b><small>${lines.length} served item${lines.length===1?'':'s'} · ${money(total)}</small></span><strong>Open</strong></button>`}).join('')}</div>`}
function tableDetail(){let t=data.tables.find(t=>t.id===state.tableId),lines=data.sales.filter(s=>s.table===t.name),total=lines.reduce((a,s)=>a+s.total,0);return `<div class="row"><button class="iconbtn" onclick="state.tableId=null;render()">‹</button><div><div class="h2">${t.name}</div><div class="muted">${lines.length} item lines served</div></div><button class="iconbtn" onclick="toast('Receipt sent to printer')">▧</button></div><div class="card"><div class="h2">${lines.length?'Current order':'No items served yet'}</div>${lines.map(s=>`<div class="receipt"><div class="row between"><span>${s.product} · ${s.unit} × ${s.qty}</span><b>${money(s.total)}</b></div><small>${s.counter}</small></div>`).join('')||'<div class="empty">Add ordered products to build this table’s check.</div>'}<div class="row between" style="margin-top:12px"><b>Table total</b><b>${money(total)}</b></div><button class="btn block" onclick="openTableProductPicker('${t.name}')">＋ Add product to table</button><button class="btn outline block" onclick="openScanner()">Scan product</button></div>`}
function openTableProductPicker(table){state.tableProductPickerTable=table;state.tableProductQuery='';renderTableProductPicker()}
function renderTableProductPicker(){let table=state.tableProductPickerTable,q=(state.tableProductQuery||'').toLowerCase();let matches=products().filter(p=>p.stock>0&&(!q||[p.name,p.brand,p.code,p.category].join(' ').toLowerCase().includes(q)));modal.innerHTML=`<div class="sheet"><div class="row between"><div><div class="h2">Add product to ${table}</div><div class="muted">Choose from in-stock products.</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><input class="input" autofocus placeholder="Search products, brands, or category..." value="${state.tableProductQuery||''}" oninput="state.tableProductQuery=this.value;renderTableProductPicker()"><div class="sectionline"><b>${matches.length} available</b><span class="tiny muted">Searchable stock</span></div><div class="list">${matches.map(p=>`<button class="listrow" onclick="chooseTableProduct('${p.code}')"><span class="grow"><b>${p.name}</b><small>${p.brand} · ${p.category} · ${p.stock} in stock</small></span><strong>＋</strong></button>`).join('')||'<div class="empty">No matching products in stock.</div>'}</div><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function chooseTableProduct(code){let table=state.tableProductPickerTable,p=products().find(x=>x.code===code);if(!p||p.stock<1)return toast('Product is out of stock');state.selectedProduct=p.code;state.selectedUnit=p.units[0][0];modal.innerHTML=saleSheet().replace('completeSale()','completeSale(\''+table+'\')');modal.classList.remove('hidden')}
function addTable(){modal.innerHTML=`<div class="sheet"><div class="h2">Add a table</div><p class="muted">Name it so orders and the printed receipt are easy to identify.</p><label class="label">Table name</label><input id="newTableName" class="input" placeholder="e.g. Table 1, Patio A"><button class="btn block" onclick="confirmTable()">Create table</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`;modal.classList.remove('hidden')}
function confirmTable(){let n=document.getElementById('newTableName').value.trim();if(!n)return toast('Enter a table name');data.tables.push({id:'t'+Date.now(),name:n.slice(0,40)});save();closeModal();toast('Table created');render()}
function teamDialog(){return `<div class="modal"><div class="sheet"><div class="row between"><div class="h2">Manage business team</div><button class="iconbtn" onclick="state.showTeam=false;render()">×</button></div><div class="card"><b>Business profile</b><input class="input" style="margin-top:8px" value="${business().name}" onchange="business().name=this.value;save()"><button class="btn block" style="margin-top:8px" onclick="toast('Business name saved')">Save business name</button></div><div class="card"><b>Create employee</b><p class="muted">Create the employee record first, then copy a one-time passkey or approve their secure QR.</p><input id="newEmployeeName" class="input" placeholder="Waiter name"><p class="muted">Access: POS / Sell, Sales reports, and Tables</p><button class="btn block" onclick="createPrototypeEmployee()">Create waiter & generate passkey</button>${business().employees.map(e=>`<button class="listrow employee-click" onclick="employeeAction('${e.id}')"><b>${e.name}</b><span>${e.role} · ${e.status.toUpperCase()}</span><small>Tap to manage access, role, and active hours</small></button>`).join('')}</div><p class="muted">Alternative: the employee can show their secure QR and the owner can scan it to load their dashboard.</p><button class="btn outline block" onclick="state.showTeam=false;openScanner()">Scan employee QR to grant access</button><button class="btn outline block" onclick="state.showTeam=false;render()">Close</button></div></div>`}
function createPrototypeEmployee(){let name=document.getElementById('newEmployeeName')?.value.trim();if(!name){toast('Enter the waiter name');return}issueEmployee(name)}
function issueEmployee(name){let employee={id:'e'+Date.now(),name,email:'Access pending',role:'waiter',status:'pending',hours:'Not set',passkey:'EMP-WAITER-'+Math.floor(1000+Math.random()*9000)};business().employees.push(employee);state.showPass=employee.passkey;save();render();toast('Waiter created; one-time passkey generated')}
function employeeAction(id){let e=business().employees.find(x=>x.id===id);if(!e)return;if(!e.passkey){e.passkey='EMP-WAITER-'+Math.floor(1000+Math.random()*9000);save()}modal.innerHTML=`<div class="sheet"><div class="row between"><div><div class="h2">Employee details</div><div class="muted">${e.name}</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="card"><b>${e.email}</b><div class="muted">${e.role} · ${e.status.toUpperCase()}</div><div class="muted">Hours: ${e.hours||'Not set'}</div></div><div class="card owner-pass-card"><div class="label">Employee passkey</div><div class="passkey">${e.passkey}</div><p class="muted">Copy this one-time passkey and send it privately to ${e.name}. It is used to open their waiter dashboard.</p><button class="btn block" onclick="copyPass('${e.passkey}')">Copy passkey</button></div><button class="btn ${e.status==='active'?'danger':'soft'} block" onclick="setEmployeeStatus('${e.id}','${e.status==='active'?'suspended':'active'}')">${e.status==='active'?'Lock sales':'Activate employee'}</button><button class="btn outline block" onclick="changeEmployeeRole('${e.id}')">Change role</button><button class="btn outline block" onclick="setEmployeeHours('${e.id}')">Set active hours</button><button class="btn danger block" onclick="removeEmployee('${e.id}')">Remove employee access</button></div>`;modal.classList.remove('hidden')}
function setEmployeeStatus(id,status){let e=business().employees.find(x=>x.id===id);if(!e)return;e.status=status;save();closeModal();toast(status==='active'?'Employee activated':'Sales locked for employee');render()}
function changeEmployeeRole(id){let e=business().employees.find(x=>x.id===id);if(!e)return;let role=prompt('Role: waiter',e.role);if(!role||role!=='waiter')return;e.role=role;save();closeModal();toast('Employee role updated');render()}
function setEmployeeHours(id){let e=business().employees.find(x=>x.id===id);if(!e)return;let hours=prompt('Weekday hours, for example 09:00–17:00',e.hours==='Not set'?'09:00–17:00':e.hours);if(!hours)return;e.hours=hours;save();closeModal();toast('Employee active hours saved');render()}
function removeEmployee(id){business().employees=business().employees.filter(e=>e.id!==id);save();closeModal();toast('Employee access removed');render()}
function signOutLock(){state={...state,screen:'auth',role:null,lockedBusinessId:null,lockedEmployeeId:null,lockMessage:''};render()}
function employeeLocked(){let b=business();return `<main class="access-state"><div class="lock-icon">×</div><div class="h1">Employee access locked</div><p>${b?.name||'This business'} has disabled this employee account. Selling, stock, and table actions are blocked by the server.</p><button class="btn block" onclick="signOutLock()">Sign out</button></main>`}
function hoursLocked(){return `<main class="access-state"><div class="lock-icon">◷</div><div class="h1">Workspace locked</div><p>${state.lockMessage||'You are outside the active working hours configured by the business owner.'}</p><button class="btn block" onclick="checkHoursAgain()">Check active hours</button><button class="btn outline block" onclick="signOutLock()">Sign out</button></main>`}
function checkHoursAgain(){let e=business()?.employees?.find(x=>x.id===state.lockedEmployeeId);if(e&&withinEmployeeHours(e)){state.screen='workspace';render()}else{toast('You are still outside your active hours')}}
function businessBlocked(){let b=business();return `<main class="access-state"><div class="lock-icon">!</div><div class="h1">Business access unavailable</div><p>The platform administrator has suspended or closed this business. Inventory and sales are retained, but all staff access is blocked until it is reopened.</p><div class="card lock-status"><b>${b?.name||'Business'}: ${b?.status||'suspended'}</b></div><button class="btn block" onclick="signOutLock()">Sign out</button></main>`}
function scanner(){return `<div class="scanner"><div class="scannerbox"><div class="h2">Scan barcode</div><div class="scanframe">▦</div><p>Point the camera at a product barcode.</p><button class="btn block" onclick="state.showScanner=false;render()">Close scanner</button></div></div>`}
function openScanner(){state.showScanner=true;render()}
function superadmin(){let bs=data.businesses,live=bs.filter(b=>b.status==='active').length,waiting=bs.filter(b=>b.ownerEmail==='Pending owner enrollment').length;return `<main class="admin-shell"><section class="admin-hero"><div class="admin-brand"><div class="admin-brand-mark">CP</div><div class="admin-brand-copy"><b>Counter POS</b><small>Platform control center</small></div><button class="admin-signout" onclick="logout()">Sign out</button></div><div class="admin-kicker">Good to see you, Admin</div><h1>Keep every business moving.</h1><p>admin@counterpos.local</p></section><section class="admin-body"><div class="admin-kpis"><div class="admin-kpi"><b>${bs.length}</b><small>Businesses</small></div><div class="admin-kpi"><b>${live}</b><small>Active</small></div><div class="admin-kpi"><b>${waiting}</b><small>Pending</small></div></div><div class="admin-actions"><button class="admin-action" onclick="registerBusiness()"><strong>＋</strong>New business</button><button class="admin-action" onclick="closeModal();openScanner()"><strong>⌁</strong>Scan QR</button></div><div class="admin-card"><div class="admin-card-head"><div class="admin-card-icon">＋</div><div><h2>Register a business</h2><p>Create a tenant, then securely enroll its owner.</p></div></div><button class="btn block" onclick="registerBusiness()">Create business profile</button></div>${state.showPass?`<div class="admin-card admin-owner-pass"><div class="label">Owner invite ready</div><div class="passkey">${state.showPass}</div><p>Send this one-time passkey privately to the business owner.</p><div class="row"><button class="btn" onclick="copyPass('${state.showPass}')">Copy passkey</button><button class="btn outline" onclick="state.showPass=null;render()">Dismiss</button></div></div>`:''}<div class="admin-section-head"><div><h2>Your businesses</h2><span class="muted tiny">Manage access, enrollment, and lifecycle status</span></div><small>${bs.length} total</small></div>${bs.map(b=>`<div class="admin-business-real card"><div class="admin-business-title"><div class="admin-business-icon">${b.name.slice(0,1).toUpperCase()}</div><div class="admin-business-copy"><b>${b.name}</b><small>${b.ownerEmail}</small></div><span class="admin-status ${b.status}">${b.status.toUpperCase()}</span></div><div class="admin-stats"><div class="admin-stat"><b>${b.members||0}</b><small>Staff</small></div><div class="admin-stat"><b>${b.productCount||0}</b><small>Products</small></div><div class="admin-stat"><b>${b.stockUnits||0}</b><small>Units</small></div></div>${b.lifecycleReason?`<div class="muted tiny">${b.lifecycleReason}</div>`:''}<button class="btn block" onclick="issueBusinessPass('${b.id}')">⌑　Generate owner passkey</button><button class="btn outline block" onclick="state.selectedBusiness='${b.id}';render()">${state.selectedBusiness===b.id?'Close business tools':'Open business tools'}　→</button>${state.selectedBusiness===b.id?`<div class="admin-tools"><h3>Business tools</h3><p>User QR format: COUNTERPOS|USER|registered-user@email|cashier</p><button class="btn block" onclick="issueBusinessPass('${b.id}')">Generate owner pass</button><button class="btn outline block" style="margin-top:7px" onclick="openScanner()">Scan user QR</button></div>`:''}<div class="row admin-status-actions" style="margin-top:10px">${b.status!=='active'?`<button class="btn soft" onclick="setBusinessStatus('${b.id}','active')">Reopen</button>`:''}${b.status==='active'?`<button class="btn outline" onclick="setBusinessStatus('${b.id}','suspended')">Suspend</button>`:''}${b.status!=='closed'?`<button class="btn outline danger-text" onclick="setBusinessStatus('${b.id}','closed')">Close</button>`:''}</div></div>`).join('')}${!bs.length?`<div class="empty">No businesses returned yet.</div>`:''}</section></main>`}
function setBusinessStatus(id,status){let b=data.businesses.find(x=>x.id===id);if(!b)return;b.status=status;save();if(status!=='active'&&state.businessId===id&&state.role==='owner'){state.screen='business-blocked';state.selectedBusiness=null;toast('Business access is now locked')}else{toast(status==='active'?'Business reopened':`Business ${status}`)}render()}
function adminDetail(){let b=data.businesses.find(x=>x.id===state.selectedBusiness);return `${header(b.name,b.type.replace('_',' ')+' · '+b.ownerEmail,'state.selectedBusiness=null;render()')}<main class="content"><div class="row"><span class="pill ${b.status==='active'?'live':'suspended'}">${b.status==='active'?'Active':'Suspended'}</span><span class="pill">${b.pass?'Waiting for owner':'Owner signed in'}</span><span class="pill">${b.members||0} staff</span></div>${b.pass?`<div class="card"><div class="label">Business owner passkey</div><div class="passkey">${b.pass}</div><button class="btn block" onclick="copyPass('${b.pass}')">Copy passkey</button>${qr(b.pass)}</div>`:''}<button class="btn block" onclick="copyPass('${b.pass||''}');toast('Passkey copied — paste it into the Counter POS sign-in screen')">Copy passkey, then sign in</button><button class="btn outline block" onclick="issueBusinessPass('${b.id}')">Generate business owner pass</button><button class="btn ${b.status==='active'?'danger':'soft'} block" onclick="toggleBusiness('${b.id}')">${b.status==='active'?'Suspend business':'Reactivate business'}</button><div class="card"><b>Business summary</b><div class="listrow">${b.members||0} staff · ${b.productCount||0} products · ${b.stockUnits||0} units</div>${b.lifecycleReason?`<div class="listrow">Reason: ${b.lifecycleReason}</div>`:''}<div class="listrow">Owner access is one-time and expires automatically</div></div></main>`}
function qr(text){let h=0;for(let c of text)h=(h*31+c.charCodeAt(0))>>>0;let a='';for(let i=0;i<169;i++){h=(h*1664525+1013904223)>>>0;a+=`<i class="${h&1?'on':''}"></i>`}return `<div class="qr">${a}</div><div class="tiny muted centertext">QR payload: CPX1.${text}</div>`}
function copyPass(p){navigator.clipboard?.writeText(p);toast('Passkey copied')}
function issueBusinessPass(id){let b=data.businesses.find(x=>x.id===id);b.pass='CPX1-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.floor(1000+Math.random()*9000);b.ownerEmail='Pending owner enrollment';save();state.showPass=b.pass;render()}
function toggleBusiness(id){let b=data.businesses.find(x=>x.id===id);b.status=b.status==='active'?'suspended':'active';save();toast('Business status updated');render()}
function registrationForm(){return `<div class="sheet"><div class="row between"><div><div class="h2">Register a client business</div><div class="muted">Create the business profile first. You can enroll its owner later with a secure QR code or passkey.</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><button class="btn outline block" onclick="closeModal();openScanner()">Scan business QR</button><label class="label">Business name</label><input id="regName" class="input" placeholder="Business name"><label class="label">Owner email (optional)</label><input id="regOwner" class="input" placeholder="Leave blank if the owner will enroll later"><label class="label">Lifecycle reason (optional)</label><input id="regReason" class="input" placeholder="Reason or note"><button class="btn block" onclick="createConfiguredBusiness()">Create business profile</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`}
function createConfiguredBusiness(){let name=document.getElementById('regName').value.trim(),owner=document.getElementById('regOwner').value.trim(),reason=document.getElementById('regReason').value.trim();if(!name)return toast('Enter a business name');let b={id:'b'+Date.now(),name,type:'big_club',size:'medium',status:'active',ownerEmail:owner||'Pending owner enrollment',lifecycleReason:reason,members:0,productCount:0,stockUnits:0,employees:[],counters:[],tablesEnabled:true,pass:null};data.businesses.push(b);save();closeModal();state.selectedBusiness=b.id;toast('Business profile created');render()}
function closeModal(){modal.classList.add('hidden');modal.innerHTML='';state.selectedProduct=null}
function render(){if(state.screen==='auth')app.innerHTML=auth();else if(state.screen==='superadmin')app.innerHTML=superadmin();else if(state.screen==='employee-locked')app.innerHTML=employeeLocked();else if(state.screen==='hours-locked')app.innerHTML=hoursLocked();else if(state.screen==='business-blocked')app.innerHTML=businessBlocked();else app.innerHTML=workspace();if(state.showPass){modal.innerHTML=`<div class="sheet"><div class="h2">One-time passkey</div><div class="passkey">${state.showPass}</div><button class="btn block" onclick="copyPass('${state.showPass}')">Copy</button><p class="muted">Generated by the backend for the selected business. Copy it and send it privately to the owner.</p><button class="btn outline block" onclick="state.showPass=null;closeModal()">Hide</button></div>`;modal.classList.remove('hidden')}}
render();

</script>
</body>
</html>
