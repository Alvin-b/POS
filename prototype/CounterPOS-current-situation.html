<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter POS — Current Situation Prototype</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--soft:#f1f5f9;--line:#dbe3ec;--text:#0f172a;--muted:#64748b;--primary:#059669;--primary-dark:#047857;--primary-soft:#d1fae5;--warning:#d97706;--warning-soft:#fef3c7;--danger:#dc2626;--danger-soft:#fee2e2;--shadow:0 10px 30px #0f172a12}*{box-sizing:border-box}body{margin:0;background:#e2e8f0;color:var(--text);font:14px/1.4 Inter,Roboto,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 40px #0f172a22;display:flex;flex-direction:column}.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--primary)}.topbar .title{flex:1}.topbar b{display:block;font-size:17px}.topbar small{color:var(--muted)}.content{padding:13px;flex:1;overflow:auto}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:11px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1}.h1{font-size:25px;font-weight:800;line-height:1.15}.h2{font-size:18px;font-weight:800}.muted{color:var(--muted)}.tiny{font-size:11px}.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.btn{border-radius:11px;padding:10px 13px;font-weight:750;background:var(--primary);color:#fff}.btn:hover{background:var(--primary-dark)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.soft{background:var(--primary-soft);color:#065f46}.btn.warn{background:var(--warning-soft);color:#92400e}.btn.danger{background:var(--danger-soft);color:#991b1b}.btn.block{width:100%}.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #05966922}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;border:1px solid var(--line);font-size:11px;font-weight:750;background:var(--surface)}.pill.live{color:#047857;background:var(--primary-soft);border-color:#a7f3d0}.pill.invited{color:#92400e;background:var(--warning-soft);border-color:#fde68a}.pill.suspended{color:#991b1b;background:var(--danger-soft);border-color:#fecaca}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.metric b{font-size:25px;display:block}.metric.green{background:var(--primary-soft);color:#065f46}.metric.amber{background:var(--warning-soft);color:#92400e}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:11px}.tab{white-space:nowrap;padding:8px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:700}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.bottom{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:7px 5px;z-index:4}.nav{flex:1;text-align:center;color:var(--muted);font-size:10px;font-weight:700;padding:6px 2px;border-radius:10px}.nav.active{color:var(--primary);background:var(--primary-soft)}.nav strong{display:block;font-size:18px;line-height:18px;margin-bottom:2px}.product{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}.product .avatar{width:42px;height:42px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center;font-size:20px}.product .price{font-weight:800;color:var(--primary-dark)}.counter{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:13px;padding:10px 12px}.counter select{border:0;background:transparent;font-weight:800;color:#065f46;width:100%;outline:none}.list-row{padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}.modal{position:fixed;inset:0;background:#0f172a66;display:grid;place-items:end center;z-index:20}.sheet{background:var(--surface);width:min(430px,100%);border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;z-index:30;font-size:13px}.qr{display:grid;grid-template-columns:repeat(13,10px);gap:2px;padding:11px;background:#fff;border:1px solid var(--line);width:max-content;margin:auto}.qr i{width:10px;height:10px;background:#fff}.qr i.on{background:#111}.hero{background:linear-gradient(135deg,#064e3b,#059669);color:#fff;border-radius:20px;padding:20px}.hero .muted{color:#d1fae5}.empty{text-align:center;padding:28px 12px;color:var(--muted)}

.iconbtn{background:transparent;border:0;font-size:20px;padding:6px;color:var(--muted)}.center{display:flex;flex-direction:column;gap:14px}.authbrand{text-align:center;padding:18px 0}.logo{width:58px;height:58px;border-radius:18px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin:0 auto 10px}.authbrand .h1{color:var(--primary-dark)}.authbrand+.card .btn{margin-top:9px}.searchrow{margin:12px 0 8px}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;color:var(--muted);font-weight:700}.chip.chosen{background:var(--primary-soft);color:#065f46;border-color:#a7f3d0}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;color:var(--muted);font-size:13px}.productgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.productcard{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:170px}.productcard:hover{border-color:var(--primary)}.productcard .prodimg{height:54px}.prodimg{font-size:34px;display:grid;place-items:center;width:52px;height:52px;background:var(--soft);border-radius:13px}.productcard span,.productcard small{font-size:11px;color:var(--muted)}.productcard strong{color:var(--primary-dark);margin-top:auto}.unitrow{display:flex;gap:8px;margin:8px 0 16px}.unit{flex:1;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:10px;color:var(--muted)}.unit b{display:block;color:var(--text);margin-top:4px}.unit.chosen{background:var(--primary-soft);border-color:var(--primary);color:#065f46}.modebar{display:flex;gap:8px;margin:12px 0}.mode{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:750;color:var(--muted)}.mode.active{background:var(--primary);color:white;border-color:var(--primary)}.summarypill{background:var(--soft);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);margin-bottom:10px}.summarypill b{float:right;color:var(--primary)}.stockcard{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:8px}.stockcard .muted{font-size:11px}.stockline{font-size:11px;color:var(--muted);margin-top:5px}.stockcard .btn{padding:6px 8px;font-size:11px}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.receipt,.reportrow,.listrow{border-top:1px solid var(--line);padding:11px 0}.receipt:first-of-type{border-top:0}.receipt small,.listrow span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.bar{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--primary);border-radius:20px}.tablelist{display:flex;flex-direction:column;gap:9px;margin-top:13px}.tablecard,.adminbusiness{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}.tablecard small,.adminbusiness small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tablecard strong{color:var(--primary)}.tableicon{font-size:25px;color:var(--primary)}.avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:#065f46;display:grid;place-items:center;font-weight:900}.passkey{font-size:25px;letter-spacing:3px;font-weight:900;text-align:center;padding:12px;color:#065f46}.centertext{text-align:center;margin:6px}.qr{display:grid;grid-template-columns:repeat(13,9px);gap:2px;padding:9px;background:#fff;border:1px solid var(--line);width:max-content;margin:12px auto}.qr i{width:9px;height:9px;background:#fff}.qr i.on{background:#111}.scanner{position:fixed;inset:0;background:#0f172acc;z-index:25;display:grid;place-items:center;padding:18px}.scannerbox{background:var(--surface);border-radius:20px;padding:18px;width:min(390px,100%);text-align:center}.scanframe{height:220px;border:3px solid var(--primary);border-radius:18px;margin:15px 0;display:grid;place-items:center;font-size:80px;color:var(--primary)}
</style><style>.employee-click{display:block;cursor:pointer;width:100%;text-align:left;background:transparent}.employee-click:hover{background:var(--primary-soft)}</style><style>.confignote{background:var(--soft);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);margin:8px 0}.counterName{margin-bottom:7px}</style><style>.employee-click{display:block;cursor:pointer;width:100%;text-align:left;background:transparent}.employee-click:hover{background:var(--primary-soft)}</style>
</head>
<body>
<div id="app" class="shell"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const seed={businesses:[{id:'riverside',name:'Riverside Club',type:'big_club',size:'large',status:'active',ownerEmail:'owner@riverside.co.ke',members:5,counters:['Counter 1','Counter 2','Counter 3','Counter 4'],pass:null},{id:'harbor',name:'Harbor Lounge',type:'counter_seller',size:'medium',status:'active',ownerEmail:'Pending owner enrollment',members:0,counters:['Main Counter'],pass:'CPX1-HARB-4821'},{id:'downtown',name:'Downtown Bottle Shop',type:'counter_seller',size:'small',status:'suspended',ownerEmail:'shop@downtown.co.ke',members:2,counters:['Main Counter'],pass:null}],products:[{code:'KE-001',name:'Tusker Lager',brand:'Tusker',size:'500 ml',category:'Beer',price:250,stock:32,image:'🍺',units:[['Bottle',250],['Glass',80]]},{code:'KE-002',name:'Coca-Cola',brand:'Coca-Cola',size:'500 ml',category:'Soft Drinks',price:100,stock:18,image:'🥤',units:[['Bottle',100]]},{code:'KE-003',name:'Red Wine',brand:'Four Cousins',size:'750 ml',category:'Wine',price:1800,stock:6,image:'🍷',units:[['Bottle',1800],['Glass',350]]},{code:'KE-004',name:'Mineral Water',brand:'Keringet',size:'500 ml',category:'Water',price:80,stock:24,image:'💧',units:[['Bottle',80]]}],catalog:[{code:'CAT-101',name:'Muratina',brand:'Local',size:'750 ml',category:'Local Liquor',price:900,image:'🍾'},{code:'CAT-102',name:'Gordon Gin',brand:'Gordon',size:'750 ml',category:'Spirits',price:2200,image:'🥃'},{code:'CAT-103',name:'Stoney',brand:'Stoney',size:'500 ml',category:'Soft Drinks',price:100,image:'🥤'}],sales:[],tables:[{id:'t1',name:'Table 1'},{id:'t2',name:'Table 2'},{id:'t3',name:'Table 3'}],employees:[{id:'e1',name:'Mary Wanjiku',role:'cashier',status:'active',hours:'09:00–18:00'},{id:'e2',name:'John Otieno',role:'inventory_clerk',status:'active',hours:'10:00–20:00'}]};
let data=JSON.parse(localStorage.getItem('counterpos-real-prototype')||'null')||seed;
data.businesses.forEach(b=>{b.tablesEnabled=b.type==='big_club'||b.type==='club';if(!Array.isArray(b.counters))b.counters=[];if(!Array.isArray(b.employees))b.employees=[];});
let state={screen:'auth',role:null,tab:'scan',businessId:'riverside',counter:'Counter 1',search:'',category:'All',stockMode:'MY_STOCK',tableId:null,selectedProduct:null,selectedUnit:null,selectedBusiness:null,showTeam:false,showPass:null,showScanner:false,notice:null};
const app=document.getElementById('app'),modal=document.getElementById('modal'),toastEl=document.getElementById('toast');
const money=n=>'KSh '+Number(n).toLocaleString(); const business=()=>data.businesses.find(b=>b.id===state.businessId); const products=()=>data.products; const save=()=>localStorage.setItem('counterpos-real-prototype',JSON.stringify(data));
function toast(t){toastEl.textContent=t;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),2400)}
function header(title,sub='',back=''){return `<div class="topbar">${back?`<button class="iconbtn" onclick="${back}">‹</button>`:'<span class="brand-dot"></span>'}<div class="title"><b>${title}</b><small>${sub}</small></div>${state.screen==='workspace'?`<button class="iconbtn" onclick="openScanner()">⌕</button><button class="iconbtn" onclick="state.showTeam=true;render()">⚙</button>`:''}${state.role?`<button class="iconbtn" onclick="logout()">↪</button>`:''}</div>`}
function auth(){return `${header('Counter POS','Secure business point of sale')}<main class="content center"><div class="authbrand"><div class="logo">CP</div><div class="h1">Counter POS</div><div class="muted">Secure business point of sale</div></div><div class="card"><div class="h2">Sign in</div><p class="muted">Use the backend-generated Superadmin token, or paste a one-time business/employee passkey. The same Counter POS APK opens the correct dashboard and business configuration.</p><input id="credential" class="input" placeholder="Passkey or access token"><button class="btn block" onclick="signIn()">Continue</button><button class="btn outline block" onclick="qrLogin()">Sign in with QR code</button><div class="tiny muted" style="margin-top:9px">Superadmin token access is separate from owner and employee passkeys.</div></div><div class="card"><div class="label">Backend-generated Superadmin access</div><button class="btn soft block" style="margin-top:8px" onclick="document.getElementById('credential').value='CPSA1|DEMO-SUPERADMIN'">Paste demo backend Superadmin token</button></div></main>`}
function signIn(){let v=document.getElementById('credential').value.trim();if(!v)return toast('Enter a passkey or token');if(v.startsWith('CPSA1'))return enter('superadmin');let b=data.businesses.find(x=>x.pass===v);if(!b)return toast('Passkey not found or already used');if(b.status!=='active')return toast('This business is suspended');state.businessId=b.id;state.counter=b.counters[0]||'';b.pass=null;b.ownerEmail=b.ownerEmail==='Pending owner enrollment'?'Owner signed in':b.ownerEmail;save();enter('owner');toast(`Opened ${b.name}`)}
function qrLogin(){modal.innerHTML=`<div class="sheet"><div class="row between"><div class="h2">Sign in with QR code</div><button class="iconbtn" onclick="closeModal()">×</button></div><p class="muted">Waiting for the business owner to approve this QR…</p>${qr('CPX1.LOGIN-CHALLENGE')}<button class="btn block" onclick="closeModal();enter('waiter');toast('Signed in successfully')">Simulate owner approval</button></div>`;modal.classList.remove('hidden')}
function enter(role){state.role=role;state.screen=role==='superadmin'?'superadmin':(role==='waiter'?'workspace':'workspace');state.tab=role==='waiter'?'scan':'scan';render()}
function logout(){state={...state,screen:'auth',role:null,showTeam:false,selectedBusiness:null};render()}
function bottom(){return `<div class="bottom"><button class="nav ${state.tab==='scan'?'active':''}" onclick="state.tab='scan';render()"><strong>▣</strong>POS / Sell</button><button class="nav ${state.tab==='stock'?'active':''}" onclick="state.tab='stock';render()"><strong>▤</strong>Stock (${products().length})</button><button class="nav ${state.tab==='sales'?'active':''}" onclick="state.tab='sales';render()"><strong>▥</strong>Sales</button><button class="nav ${state.tab==='reports'?'active':''}" onclick="state.tab='reports';render()"><strong>▦</strong>Reports</button>${business().tablesEnabled?`<button class="nav ${state.tab==='tables'?'active':''}" onclick="state.tab='tables';render()"><strong>♧</strong>Tables</button>`:''}</div>`}
function counter(){if(!business().counters.length)return '';return `<div class="counter"><div class="row between"><b>Taking drinks from: ${state.counter}</b><span class="tiny">Change</span></div><select onchange="state.counter=this.value;render()">${business().counters.map(c=>`<option ${c===state.counter?'selected':''}>${c}</option>`).join('')}</select></div>`}
function workspace(){let title=business().name;return `${header(title,state.role==='waiter'?'Employee workspace':'Owner workspace')}<main class="content">${counter()}${state.tab==='scan'?sell():state.tab==='stock'?stock():state.tab==='sales'?sales():state.tab==='reports'?reports():tables()}</main>${bottom()}${state.showTeam?teamDialog():''}${state.showScanner?scanner():''}`}
function sell(){let q=state.search.toLowerCase(),items=products().filter(p=>(state.category==='All'||p.category===state.category)&&(!q||[p.name,p.brand,p.code].join(' ').toLowerCase().includes(q)));let cats=['All',...new Set(products().map(p=>p.category))];return `<div class="row between"><div><div class="h1">Sell</div><div class="muted">Tap a product to sell bottle / glass / cup.</div></div><button class="btn" onclick="openScanner()">Scan</button></div><div class="searchrow"><input class="input" value="${state.search}" oninput="state.search=this.value;render()" placeholder="Search to sell..."></div><div class="chips">${cats.map(c=>`<button class="chip ${state.category===c?'chosen':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div class="sectionline"><b>Shop Inventory (${items.length})</b><span class="tiny muted">${state.counter}</span></div><div class="productgrid">${items.map(p=>`<button class="productcard" onclick="openSale('${p.code}')"><div class="prodimg">${p.image}</div><b>${p.name}</b><span>${p.brand} · ${p.size}</span><strong>${money(p.price)}</strong><small>${p.stock} in stock</small></button>`).join('')}</div>${!items.length?`<div class="empty">No products match '${state.search}'.</div>`:''}</div>`}
function openSale(code){state.selectedProduct=code;state.selectedUnit=null;modal.innerHTML=saleSheet();modal.classList.remove('hidden')}
function saleSheet(){let p=products().find(x=>x.code===state.selectedProduct),unit=state.selectedUnit||p.units[0][0];return `<div class="sheet"><div class="row between"><div><div class="h2">${p.name}</div><div class="muted">${p.brand} · ${p.size} · ${p.stock} in stock</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="label" style="margin-top:16px">Unit of sale</div><div class="unitrow">${p.units.map(u=>`<button class="unit ${unit===u[0]?'chosen':''}" onclick="state.selectedUnit='${u[0]}';openSale('${p.code}')">${u[0]}<b>${money(u[1])}</b></button>`).join('')}</div><label class="label">Quantity to sell</label><input id="qty" class="input" type="number" min="1" max="${p.stock}" value="1"><button class="btn block" onclick="completeSale()">Complete Sale · ${money(p.units.find(u=>u[0]===unit)[1])}</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`}
function completeSale(table=null){let p=products().find(x=>x.code===state.selectedProduct),u=state.selectedUnit||p.units[0][0],price=p.units.find(x=>x[0]===u)[1],qty=Math.max(1,Number(document.getElementById('qty').value||1));if(p.stock<qty)return toast('Could not record sale. Check stock.');p.stock-=qty;data.sales.unshift({id:Date.now(),product:p.name,code:p.code,unit:u,qty,total:qty*price,counter:state.counter,table:table||null,waiter:state.role==='waiter'?'Employee':'Owner',time:new Date().toISOString()});save();closeModal();toast(`Sold ${qty}x ${p.name} (${u}) · ${money(qty*price)}`);render()}
function stock(){let mine=state.stockMode==='MY_STOCK',list=(mine?products():data.catalog).filter(p=>!state.search||[p.name,p.brand].join(' ').toLowerCase().includes(state.search.toLowerCase()));return `<div class="row between"><div><div class="h1">Stock</div><div class="muted">Manage your shelf and beverage catalog.</div></div>${state.role==='owner'?`<button class="btn soft" onclick="newProduct()">＋ New</button>`:''}</div><div class="modebar"><button class="mode ${mine?'active':''}" onclick="state.stockMode='MY_STOCK';render()">Shop Shelf (${products().length})</button><button class="mode ${!mine?'active':''}" onclick="state.stockMode='LIBRARY';render()">Catalog (${data.catalog.length})</button></div>${mine?`<div class="summarypill">Total: ${products().reduce((a,p)=>a+p.stock,0)} bottles on shelf across ${products().length} products <b>Add / Edit below</b></div>`:''}<input class="input" value="${state.search}" oninput="state.search=this.value;render()" placeholder="Search bottles & brands...">${list.map(p=>mine?stockCard(p):catalogCard(p)).join('')}</div>`}
function stockCard(p){return `<div class="stockcard"><div class="prodimg">${p.image}</div><div class="grow"><b>${p.name}</b><div class="muted">${p.brand} · ${p.size} · ${p.category}</div><div class="stockline"><strong>${p.stock}</strong> bottles on shelf · ${money(p.price)}</div></div>${state.role!=='waiter'?`<button class="btn outline" onclick="addStock('${p.code}')">Add</button><button class="btn outline" onclick="editProduct('${p.code}')">Edit</button>`:''}</div>`}
function catalogCard(p){return `<div class="stockcard"><div class="prodimg">${p.image}</div><div class="grow"><b>${p.name}</b><div class="muted">${p.brand} · ${p.size} · ${p.category}</div><div class="stockline">Suggested: ${money(p.price)}</div></div>${state.role!=='waiter'?`<button class="btn" onclick="addCatalog('${p.code}')">Add to Stock</button>`:''}</div>`}
function addStock(code){let n=prompt('Number of bottles to add','6');if(!n)return;let p=products().find(x=>x.code===code);p.stock+=Math.max(1,Number(n));save();toast(`Added ${n} bottles to ${p.name}`);render()}
function addCatalog(code){let p=data.catalog.find(x=>x.code===code);products().push({...p,stock:12,units:[['Bottle',p.price]]});data.catalog=data.catalog.filter(x=>x.code!==code);save();toast(`${p.name} added to stock`);render()}
function editProduct(code){let p=products().find(x=>x.code===code);let n=prompt('Product name',p.name);if(n)p.name=n;let price=prompt('Base Price (KSh)',p.price);if(price)p.price=Number(price);save();toast('Product changes saved');render()}
function newProduct(){let n=prompt('Product Name');if(!n)return;let price=Number(prompt('Bottle Price (KSh)','500')||500);products().push({code:'LOCAL-'+Date.now(),name:n,brand:'Local',size:'',category:'Local Liquor',price,stock:Number(prompt('Initial Stock (Bottles)','12')||12),image:'🍾',units:[['Bottle',price]]});save();toast('New product added to stock');render()}
function sales(){let total=data.sales.reduce((a,s)=>a+s.total,0),units=data.sales.reduce((a,s)=>a+s.qty,0);return `<div class="h1">Sales</div><div class="metricgrid"><div class="metric green"><span>Today's Revenue</span><b>${money(total)}</b></div><div class="metric"><span>Units / Bottles Sold</span><b>${units}</b></div></div><button class="btn outline block" onclick="undoSale()">↶ Undo last sale & restore shelf stock</button><button class="btn outline block" onclick="toast('Sales PDF date range selected')">▧ Export sales PDF by date</button><div class="sectionline"><b>Sales Receipts (${data.sales.length})</b></div>${data.sales.length?data.sales.map(s=>`<div class="receipt"><div class="row between"><b>${s.product}</b><strong>${money(s.total)}</strong></div><div class="muted">${s.qty} × ${s.unit} · ${s.counter}${s.table?' · '+s.table:''}</div><div class="tiny muted">${s.waiter} · ${new Date(s.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):`<div class="empty">No sales made today yet. Go to POS tab to sell products.</div>`}</div>`}
function undoSale(){let s=data.sales.shift();if(!s)return toast('Nothing to undo');let p=products().find(p=>p.code===s.code);if(p)p.stock+=s.qty;save();toast('Last sale undone and stock restored');render()}
function reports(){let rows=business().counters.map(c=>{let a=data.sales.filter(s=>s.counter===c);return {c,n:a.reduce((x,s)=>x+s.qty,0),sales:a.length,total:a.reduce((x,s)=>x+s.total,0)}}),units=rows.reduce((x,r)=>x+r.n,0),total=rows.reduce((x,r)=>x+r.total,0);return `<div class="row between"><div><div class="h1">Counter report</div><div class="muted">Today · drinks taken from each source counter</div></div><button class="iconbtn" onclick="render()">↻</button></div><div class="metricgrid"><div class="metric green"><span>Total units</span><b>${units}</b></div><div class="metric"><span>Total revenue</span><b>${money(total)}</b></div></div><div class="card"><div class="h2">Counter movement</div>${rows.map(r=>`<div class="reportrow"><div class="row between"><b>${r.c}</b><strong>${money(r.total)}</strong></div><div class="row between tiny muted"><span>${r.sales} sales</span><span>${r.n} units</span></div><div class="bar"><i style="width:${units?Math.max(3,r.n/units*100):3}%"></i></div></div>`).join('')}</div>${!data.sales.length?`<div class="empty">No counter data for today yet.</div>`:''}</div>`}
function tables(){if(state.tableId)return tableDetail();return `<div class="row between"><div><div class="h1">Tables</div><div class="muted">Open a running bill for each table and print it when guests are ready to pay.</div></div><button class="btn" onclick="addTable()">＋ Add table</button></div><div class="tablelist">${data.tables.map(t=>{let lines=data.sales.filter(s=>s.table===t.name),total=lines.reduce((a,s)=>a+s.total,0);return `<button class="tablecard" onclick="state.tableId='${t.id}';render()"><span class="tableicon">♧</span><span class="grow"><b>${t.name}</b><small>${lines.length} served item${lines.length===1?'':'s'} · ${money(total)}</small></span><strong>Open</strong></button>`}).join('')}</div>`}
function tableDetail(){let t=data.tables.find(t=>t.id===state.tableId),lines=data.sales.filter(s=>s.table===t.name),total=lines.reduce((a,s)=>a+s.total,0);return `<div class="row"><button class="iconbtn" onclick="state.tableId=null;render()">‹</button><div><div class="h2">${t.name}</div><div class="muted">${lines.length} item lines served</div></div><button class="iconbtn" onclick="toast('Receipt sent to printer')">▧</button></div><div class="card"><div class="h2">${lines.length?'Current order':'No items served yet'}</div>${lines.map(s=>`<div class="receipt"><div class="row between"><span>${s.product} · ${s.unit} × ${s.qty}</span><b>${money(s.total)}</b></div><small>${s.counter}</small></div>`).join('')||'<div class="empty">Add ordered products to build this table’s check.</div>'}<div class="row between" style="margin-top:12px"><b>Table total</b><b>${money(total)}</b></div><button class="btn block" onclick="addToTable('${t.name}')">＋ Add product to table</button><button class="btn outline block" onclick="openScanner()">Scan product</button></div>`}
function addToTable(table){let p=products().find(p=>p.stock>0);if(!p)return toast('No in-stock products');state.selectedProduct=p.code;state.selectedUnit=p.units[0][0];modal.innerHTML=saleSheet().replace('completeSale()','completeSale(\''+table+'\')');modal.classList.remove('hidden')}
function addTable(){let n=prompt('Table name','Patio A');if(!n)return;data.tables.push({id:'t'+Date.now(),name:n.slice(0,40)});save();toast('Table created');render()}
function teamDialog(){return `<div class="modal"><div class="sheet"><div class="row between"><div class="h2">Manage business team</div><button class="iconbtn" onclick="state.showTeam=false;render()">×</button></div><div class="card"><b>Business profile</b><input class="input" style="margin-top:8px" value="${business().name}" onchange="business().name=this.value;save()"><button class="btn block" style="margin-top:8px" onclick="toast('Business name saved')">Save business name</button></div><div class="card"><b>Create employee</b><p class="muted">Create the employee record first, then copy a one-time passkey or approve their secure QR.</p><input id="newEmployeeName" class="input" placeholder="Waiter name"><p class="muted">Access: POS / Sell, Sales reports, and Tables</p><button class="btn block" onclick="createPrototypeEmployee()">Create waiter & generate passkey</button>${business().employees.map(e=>`<button class="listrow employee-click" onclick="employeeAction('${e.id}')"><b>${e.name}</b><span>${e.role} · ${e.status.toUpperCase()}</span><small>Tap to manage access, role, and active hours</small></button>`).join('')}</div><p class="muted">Alternative: the employee can show their secure QR and the owner can scan it to load their dashboard.</p><button class="btn outline block" onclick="state.showTeam=false;openScanner()">Scan employee QR to grant access</button><button class="btn outline block" onclick="state.showTeam=false;render()">Close</button></div></div>`}
function createPrototypeEmployee(){let name=document.getElementById('newEmployeeName')?.value.trim();if(!name){toast('Enter the waiter name');return}issueEmployee(name)}
function issueEmployee(name){let employee={id:'e'+Date.now(),name,email:'Access pending',role:'waiter',status:'pending',hours:'Not set'};business().employees.push(employee);state.showPass='EMP-WAITER-'+Math.floor(1000+Math.random()*9000);save();render();toast('Waiter created; one-time passkey generated')}
function employeeAction(id){let e=business().employees.find(x=>x.id===id);if(!e)return;modal.innerHTML=`<div class="sheet"><div class="row between"><div><div class="h2">Employee details</div><div class="muted">${e.name}</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="card"><b>${e.email}</b><div class="muted">${e.role} · ${e.status.toUpperCase()}</div><div class="muted">Hours: ${e.hours||'Not set'}</div></div><button class="btn ${e.status==='active'?'danger':'soft'} block" onclick="setEmployeeStatus('${e.id}','${e.status==='active'?'suspended':'active'}')">${e.status==='active'?'Lock sales':'Activate employee'}</button><button class="btn outline block" onclick="changeEmployeeRole('${e.id}')">Change role</button><button class="btn outline block" onclick="setEmployeeHours('${e.id}')">Set active hours</button><button class="btn danger block" onclick="removeEmployee('${e.id}')">Remove employee access</button></div>`;modal.classList.remove('hidden')}
function setEmployeeStatus(id,status){let e=business().employees.find(x=>x.id===id);if(!e)return;e.status=status;save();closeModal();toast(status==='active'?'Employee activated':'Sales locked for employee');render()}
function changeEmployeeRole(id){let e=business().employees.find(x=>x.id===id);if(!e)return;let role=prompt('Role: waiter',e.role);if(!role||role!=='waiter')return;e.role=role;save();closeModal();toast('Employee role updated');render()}
function setEmployeeHours(id){let e=business().employees.find(x=>x.id===id);if(!e)return;let hours=prompt('Weekday hours, for example 09:00–17:00',e.hours==='Not set'?'09:00–17:00':e.hours);if(!hours)return;e.hours=hours;save();closeModal();toast('Employee active hours saved');render()}
function removeEmployee(id){business().employees=business().employees.filter(e=>e.id!==id);save();closeModal();toast('Employee access removed');render()}
function scanner(){return `<div class="scanner"><div class="scannerbox"><div class="h2">Scan barcode</div><div class="scanframe">▦</div><p>Point the camera at a product barcode.</p><button class="btn block" onclick="state.showScanner=false;render()">Close scanner</button></div></div>`}
function openScanner(){state.showScanner=true;render()}
function superadmin(){if(state.selectedBusiness)return adminDetail();let bs=data.businesses,live=bs.filter(b=>b.status==='active'&&b.ownerEmail!=='Pending owner enrollment').length,waiting=bs.filter(b=>b.ownerEmail==='Pending owner enrollment').length;return `${header('Platform admin',bs.length+' businesses')}<main class="content"><div class="row between"><div><div class="h1">Platform admin</div><div class="muted">${bs.length} businesses</div></div><button class="btn" onclick="registerBusiness()">Register</button></div><div class="metricgrid"><div class="metric green"><span>Live</span><b>${live}</b></div><div class="metric amber"><span>Awaiting owner</span><b>${waiting}</b></div><div class="metric"><span>Suspended</span><b>${bs.filter(b=>b.status==='suspended').length}</b></div><div class="metric"><span>Closed</span><b>${bs.filter(b=>b.status==='closed').length}</b></div></div><div class="sectionline"><b>Businesses</b><span>${bs.length} shown</span></div>${bs.map(b=>`<button class="adminbusiness" onclick="state.selectedBusiness='${b.id}';render()"><div class="avatar">${b.name[0]}</div><div class="grow"><b>${b.name}</b><small>${b.type.replace('_',' ')} · ${b.ownerEmail}</small></div><span class="pill ${b.status==='active'?(b.pass?'invited':'live'):'suspended'}">${b.status==='active'?(b.pass?'Invited':'Live'):b.status}</span></button>`).join('')}</main>`}
function adminDetail(){let b=data.businesses.find(x=>x.id===state.selectedBusiness);return `${header(b.name,b.type.replace('_',' ')+' · '+b.ownerEmail,'state.selectedBusiness=null;render()')}<main class="content"><div class="row"><span class="pill ${b.status==='active'?'live':'suspended'}">${b.status==='active'?'Active':'Suspended'}</span><span class="pill">${b.pass?'Waiting for owner':'Owner signed in'}</span><span class="pill">${b.members} employees</span></div>${b.pass?`<div class="card"><div class="label">Business owner passkey</div><div class="passkey">${b.pass}</div><button class="btn block" onclick="copyPass('${b.pass}')">Copy passkey</button>${qr(b.pass)}</div>`:''}<button class="btn block" onclick="copyPass('${b.pass||''}');toast('Passkey copied — paste it into the Counter POS sign-in screen')">Copy passkey, then sign in</button><button class="btn outline block" onclick="issueBusinessPass('${b.id}')">Generate business owner passkey</button><button class="btn ${b.status==='active'?'danger':'soft'} block" onclick="toggleBusiness('${b.id}')">${b.status==='active'?'Suspend business':'Reactivate business'}</button><div class="card"><b>Audit history</b><div class="listrow">Business profile created</div><div class="listrow">${b.counters.length} source counters configured</div><div class="listrow">Owner access is one-time and expires automatically</div></div></main>`}
function qr(text){let h=0;for(let c of text)h=(h*31+c.charCodeAt(0))>>>0;let a='';for(let i=0;i<169;i++){h=(h*1664525+1013904223)>>>0;a+=`<i class="${h&1?'on':''}"></i>`}return `<div class="qr">${a}</div><div class="tiny muted centertext">QR payload: CPX1.${text}</div>`}
function copyPass(p){navigator.clipboard?.writeText(p);toast('Passkey copied')}
function issueBusinessPass(id){let b=data.businesses.find(x=>x.id===id);b.pass='CPX1-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.floor(1000+Math.random()*9000);b.ownerEmail='Pending owner enrollment';save();state.showPass=b.pass;render()}
function toggleBusiness(id){let b=data.businesses.find(x=>x.id===id);b.status=b.status==='active'?'suspended':'active';save();toast('Business status updated');render()}
function registrationForm(){return `<div class="sheet"><div class="row between"><div><div class="h2">Register business</div><div class="muted">Create the business profile first, then issue the owner passkey from its admin page.</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><label class="label">Business name</label><input id="regName" class="input" placeholder="e.g. Riverside Club"><label class="label">Owner email</label><input id="regOwner" class="input" placeholder="owner@example.com"><label class="label">Kind of business</label><select id="regType" class="input" onchange="registrationTypeChanged()"><option value="club">Club</option><option value="liquor_store">Liquor store</option><option value="garden">Garden</option></select><div id="regConfig"></div><button class="btn block" onclick="createConfiguredBusiness()">Register business profile</button><button class="btn outline block" onclick="closeModal()">Cancel</button></div>`}
function registrationTypeChanged(){let type=document.getElementById('regType').value,el=document.getElementById('regConfig');if(type==='club')el.innerHTML='<label class="label">Number of counters</label><select id="regCounters" class="input" onchange="counterNamesForm()"><option>1</option><option>2</option><option selected>4</option><option>5</option><option>6</option></select><div id="counterNames"></div><div class="confignote">Club dashboard: Tables are enabled and sales can be attributed to each configured source counter.</div>';else if(type==='garden')el.innerHTML='<div class="confignote">Garden dashboard: sales use the configured Garden Bar source counter.</div>';else el.innerHTML='<div class="confignote">Liquor store dashboard: source counters are disabled and there is no table feature. The app opens POS, Stock, Sales, and Reports only.</div>';if(type==='club')counterNamesForm()}
function counterNamesForm(){let n=Number(document.getElementById('regCounters').value),el=document.getElementById('counterNames');el.innerHTML=Array.from({length:n},(_,i)=>`<label class="label">Counter ${i+1} label</label><input class="input counterName" value="Counter ${i+1}" placeholder="e.g. Main Bar">`).join('')}
function registerBusiness(){modal.innerHTML=registrationForm();modal.classList.remove('hidden');registrationTypeChanged()}
function createConfiguredBusiness(){let name=document.getElementById('regName').value.trim(),owner=document.getElementById('regOwner').value.trim(),type=document.getElementById('regType').value;if(!name)return toast('Enter a business name');let counters=type==='club'?[...document.querySelectorAll('.counterName')].map(x=>x.value.trim()).filter(Boolean):type==='garden'?['Garden Bar']:[];let b={id:'b'+Date.now(),name,type,size:'medium',status:'active',ownerEmail:owner||'Pending owner enrollment',members:0,employees:[],counters,tablesEnabled:type==='club',pass:null};data.businesses.push(b);save();closeModal();state.selectedBusiness=b.id;toast('Business profile created. Select it to generate the owner passkey.');render()}
function closeModal(){modal.classList.add('hidden');modal.innerHTML='';state.selectedProduct=null}
function render(){if(state.screen==='auth')app.innerHTML=auth();else if(state.screen==='superadmin')app.innerHTML=superadmin();else app.innerHTML=workspace();if(state.showPass){modal.innerHTML=`<div class="sheet"><div class="h2">One-time passkey</div><div class="passkey">${state.showPass}</div><button class="btn block" onclick="copyPass('${state.showPass}')">Copy</button><p class="muted">Generated by the backend for this business. Copy it and send it privately; it can be redeemed once and expires automatically.</p><button class="btn outline block" onclick="state.showPass=null;closeModal()">Hide</button></div>`;modal.classList.remove('hidden')}}
render();

</script>
</body>
</html>
