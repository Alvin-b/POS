name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare release signing key
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          encoded = os.environ.get("ANDROID_SIGNING_BUNDLE", "")
          if not encoded:
              raise SystemExit("Missing repository Actions secret ANDROID_SIGNING_BUNDLE.")
          data = json.loads(base64.b64decode(encoded, validate=True))
          key_path = Path(os.environ["RUNNER_TEMP"]) / "counterpos-release.jks"
          key_path.write_bytes(base64.b64decode(data["keystore_base64"], validate=True))
          values = {
              "KEYSTORE_PATH": str(key_path),
              "STORE_PASSWORD": data["store_password"],
              "KEY_ALIAS": data["key_alias"],
              "KEY_PASSWORD": data["key_password"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Set Android version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --no-daemon

      - name: Name APK for download
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CounterPOS.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CounterPOS-${{ github.ref_name }}
          path: app/build/outputs/apk/release/CounterPOS.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/CounterPOS.apk \
            --title "Counter POS $VERSION_NAME" \
            --generate-notes \
            --verify-tag
